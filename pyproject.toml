[project]
name = "mooltrace"
version = "0.1.0"
description = "Trace your AI's answer to its root, and see if that root is flagged."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "falkordblite==0.10.0",
  "falkordb>=1.2.0",
  "mcp>=2.0",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mooltrace = "mooltrace.__main__:main"
mooltrace-mcp = "mooltrace.mcp_server:main"
mooltrace-api = "mooltrace.api:main"
mooltrace-gate = "mooltrace.gate:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mooltrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
